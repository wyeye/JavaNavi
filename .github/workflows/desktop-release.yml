name: Desktop release packages

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  # Pull requests use quick-verify.yml; full desktop packaging is expensive and
  # remains available on pushes, tags, and manual dispatch.

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Keep updater signing env names stable for Tauri CLI and tauri-action.
  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  # Temurin 17 is not available on the GitHub-hosted Windows ARM64 runner;
  # build with Java 21 while keeping Java source/target compatibility at 17.
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  CARGO_TERM_COLOR: always

jobs:
  build-desktop-package:
    name: ${{ matrix.name }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            arch: amd64
            runner: ubuntu-24.04
            runner-arch: X64
            platform: linux
            runtime-platform: linux
            tauri-action-args: --bundles deb,rpm,appimage
          - name: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            runner-arch: ARM64
            platform: linux
            runtime-platform: linux
            tauri-action-args: --bundles deb,rpm,appimage
          - name: windows
            arch: amd64
            runner: windows-2025
            runner-arch: X64
            platform: windows
            runtime-platform: windows
            tauri-action-args: --bundles nsis
          - name: windows
            arch: arm64
            runner: windows-11-arm
            runner-arch: ARM64
            platform: windows
            runtime-platform: windows
            tauri-action-args: --bundles nsis
          - name: macos
            arch: amd64
            runner: macos-15-intel
            runner-arch: X64
            platform: macos
            runtime-platform: macos
            tauri-action-args: --bundles app,dmg
          - name: macos
            arch: arm64
            runner: macos-15
            runner-arch: ARM64
            platform: macos
            runtime-platform: macos
            tauri-action-args: --bundles app,dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2t64 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            librsvg2-dev \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Prepare Maven cache repository
        run: |
          set -euo pipefail
          echo "MAVEN_REPO=$HOME/.m2/repository" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.m2/repository"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Install root dependencies
        run: npm ci

      - name: Resolve package version
        run: |
          set -euo pipefail
          echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Use Bash for npm scripts on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: npm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      - name: Stage desktop resources
        env:
          JAVANAVI_DESKTOP_RUNTIME_PLATFORM: ${{ matrix.runtime-platform }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "windows" ]] && command -v cygpath >/dev/null 2>&1; then
            export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
            export JAVANAVI_DESKTOP_JAVA_HOME="$JAVA_HOME"
          fi
          npm run desktop:stage

      - name: Build and publish signed desktop release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: JavaNavi ${{ github.ref_name }}
          releaseBody: Automated signed JavaNavi desktop package build for Linux, Windows, macOS, and latest.json updater metadata.
          releaseDraft: false
          prerelease: false
          tauriScript: npx tauri
          args: ${{ matrix.tauri-action-args }}
          updaterJsonPreferNsis: true
          includeUpdaterJson: true

      - name: Build desktop package for branch artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          JAVANAVI_DESKTOP_RUNTIME_PLATFORM: ${{ matrix.runtime-platform }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "windows" ]] && command -v cygpath >/dev/null 2>&1; then
            export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
            export JAVANAVI_DESKTOP_JAVA_HOME="$JAVA_HOME"
          fi
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            npm run desktop:build:linux
          elif [[ "${{ matrix.platform }}" == "macos" ]]; then
            npm run desktop:build:macos
          elif [[ "${{ matrix.platform }}" == "windows" ]]; then
            npm run desktop:build:windows
          else
            npm run desktop:build
          fi

      - name: Create macOS DMG
        if: ${{ matrix.platform == 'macos' && !startsWith(github.ref, 'refs/tags/v') }}
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app_path="src-tauri/target/release/bundle/macos/JavaNavi.app"
          dmg_dir="src-tauri/target/release/bundle/dmg"
          dmg_path="${dmg_dir}/JavaNavi_${PACKAGE_VERSION}_${PACKAGE_ARCH}.dmg"
          if [[ ! -d "$app_path" ]]; then
            echo "macOS app bundle was not created: $app_path" >&2
            exit 1
          fi
          rm -rf "$dmg_dir" "$RUNNER_TEMP/javanavi-dmg-root"
          mkdir -p "$dmg_dir" "$RUNNER_TEMP/javanavi-dmg-root"
          cp -R "$app_path" "$RUNNER_TEMP/javanavi-dmg-root/JavaNavi.app"
          ln -s /Applications "$RUNNER_TEMP/javanavi-dmg-root/Applications"
          du -sh "$RUNNER_TEMP/javanavi-dmg-root"
          hdiutil create \
            -volname "JavaNavi ${PACKAGE_VERSION}" \
            -srcfolder "$RUNNER_TEMP/javanavi-dmg-root" \
            -ov \
            -format UDZO \
            "$dmg_path"
          hdiutil verify "$dmg_path"
          ls -lh "$dmg_path"

      - name: Collect desktop bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner-arch }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          case "${EXPECTED_RUNNER_ARCH}:${RUNNER_ARCH}" in
            X64:X64|X64:x64|X64:AMD64|X64:amd64|X64:x86_64|X64:X86_64) ;;
            ARM64:ARM64|ARM64:arm64|ARM64:AARCH64|ARM64:aarch64|ARM64:ARM|ARM64:arm) ;;
            *)
              echo "Expected ${EXPECTED_RUNNER_ARCH} GitHub-hosted runner for ${PLATFORM}/${PACKAGE_ARCH}, got ${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          out_dir="dist/desktop-${PLATFORM}-${PACKAGE_ARCH}"
          mkdir -p "$out_dir"
          if [[ ! -d src-tauri/target/release/bundle ]]; then
            echo "Tauri bundle directory was not created" >&2
            exit 1
          fi
          if [[ -z "$(find src-tauri/target/release/bundle -maxdepth 5 -type f -print -quit)" ]]; then
            echo "Tauri bundle directory does not contain package files" >&2
            exit 1
          fi
          find src-tauri/target/release/bundle -maxdepth 5 -type f -print | sort
          selected_list="$RUNNER_TEMP/javanavi-release-package-files.txt"
          case "$PLATFORM" in
            linux)
              find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.AppImage.sig' \) -print | sort > "$selected_list"
              ;;
            macos)
              find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -print | sort > "$selected_list"
              ;;
            windows)
              find src-tauri/target/release/bundle -type f \( -name '*-setup.exe' -o -name '*-setup.exe.sig' \) -print | sort > "$selected_list"
              ;;
            *)
              echo "Unsupported desktop package platform: $PLATFORM" >&2
              exit 1
              ;;
          esac
          if [[ ! -s "$selected_list" ]]; then
            echo "No release package files were selected for ${PLATFORM}/${PACKAGE_ARCH}" >&2
            exit 1
          fi
          printf 'Selected release package files:\n'
          cat "$selected_list"
          while IFS= read -r package_file; do
            cp "$package_file" "$out_dir/"
          done < "$selected_list"

      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: javanavi-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/desktop-${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14
