[package]
name = "javanavi-desktop"
version = "0.1.5"
description = "JavaNavi Tauri desktop shell for the Spring Boot web package"
authors = ["wyeye"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "javanavi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = true
