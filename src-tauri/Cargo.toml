[package]
name = "javanavi-desktop"
version = "0.1.10"
description = "JavaNavi Tauri desktop shell for the Spring Boot web package"
authors = ["wyeye"]
homepage = "https://github.com/wyeye/JavaNavi"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "javanavi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false, features = ["system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common"
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = true
