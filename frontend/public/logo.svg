<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#1B2838"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64FFDA"/>
      <stop offset="100%" style="stop-color:#00BFA5"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#bg)"/>

  <!-- 抽象数据库层叠 -->
  <g transform="translate(50, 55)">
    <rect x="0" y="10" width="60" height="6" rx="3" fill="#64FFDA" opacity="0.15"/>
    <rect x="6" y="25" width="60" height="6" rx="3" fill="#64FFDA" opacity="0.3"/>
    <rect x="0" y="40" width="72" height="8" rx="4" fill="url(#accent)"/>
    <rect x="6" y="58" width="60" height="6" rx="3" fill="#64FFDA" opacity="0.3"/>
    <rect x="0" y="73" width="48" height="6" rx="3" fill="#64FFDA" opacity="0.15"/>
  </g>

  <!-- 导航菱形 -->
  <g transform="translate(86, 34)">
    <polygon points="36,0 0,22 36,44 72,22" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="36,8 12,22 36,36 60,22" fill="#64FFDA" opacity="0.3"/>
  </g>

  <!-- 品牌名 -->
  <text x="100" y="140" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#E0E0E0" text-anchor="middle" letter-spacing="1.5">
    Java<tspan fill="#64FFDA">Navi</tspan>
  </text>

  <!-- 底部装饰点 -->
  <circle cx="100" cy="160" r="2" fill="#64FFDA" opacity="0.6"/>
</svg>